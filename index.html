<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALIMENTARUS SYSTEMS | INITIALIZING</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;800&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #050505;
            --white: #e0e0e0;
            --accent: #ff3c00; /* Industrial Orange */
            --glass: rgba(255, 255, 255, 0.05);
            --grid: rgba(255, 255, 255, 0.03);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            cursor: none; /* Custom cursor used */
        }

        body {
            background-color: var(--bg);
            color: var(--white);
            font-family: 'Syne', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            perspective: 1000px;
        }

        /* --- BACKGROUND MESH --- */
        #canvas-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.4;
        }

        /* --- GRAIN OVERLAY --- */
        .grain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='1'/%3E%3C/svg%3E");
            opacity: 0.05;
            pointer-events: none;
            z-index: 2;
        }

        /* --- CUSTOM CURSOR --- */
        .cursor {
            width: 20px;
            height: 20px;
            border: 1px solid var(--white);
            border-radius: 50%;
            position: absolute;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: width 0.3s, height 0.3s, background-color 0.3s;
            mix-blend-mode: difference;
        }
        
        .cursor.hovered {
            width: 50px;
            height: 50px;
            background-color: var(--white);
            border-color: transparent;
        }

        /* --- UI LAYOUT --- */
        .ui-layer {
            position: relative;
            z-index: 10;
            height: 100%;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: 1fr auto 1fr;
            padding: 4vw;
            pointer-events: none; /* Let clicks pass through unless on button */
        }

        /* --- HEADER & META --- */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            font-family: 'Manrope', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 0.1em;
            opacity: 0.7;
            text-transform: uppercase;
        }

        .status-dot {
            height: 8px;
            width: 8px;
            background-color: var(--accent);
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }

        /* --- HERO TYPOGRAPHY --- */
        .hero-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            transform-style: preserve-3d;
        }

        h1 {
            font-size: clamp(3rem, 12vw, 15rem);
            line-height: 0.8;
            font-weight: 800;
            text-align: center;
            color: transparent;
            -webkit-text-stroke: 1px var(--white);
            position: relative;
            transition: transform 0.1s ease-out;
            pointer-events: auto;
        }

        h1 span {
            display: block;
        }

        .filled-text {
            color: var(--white);
            -webkit-text-stroke: 0;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            clip-path: polygon(0 0, 100% 0, 100% 0, 0 0); /* Hidden initially */
            animation: textReveal 1.5s cubic-bezier(0.19, 1, 0.22, 1) forwards;
            animation-delay: 0.5s;
        }

        .sub-hero {
            font-family: 'Manrope', sans-serif;
            font-size: clamp(0.8rem, 1.5vw, 2rem);
            letter-spacing: 0.5em;
            margin-top: 2rem;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeUp 1s ease-out forwards;
            animation-delay: 1.2s;
            mix-blend-mode: exclusion;
        }

        /* --- FOOTER & CTA --- */
        .bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            font-family: 'Manrope', sans-serif;
        }

        .cta-btn {
            pointer-events: auto;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: var(--white);
            padding: 1rem 3rem;
            font-family: 'Manrope', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            font-size: 0.8rem;
            transition: all 0.4s cubic-bezier(0.19, 1, 0.22, 1);
            position: relative;
            overflow: hidden;
        }

        .cta-btn:hover {
            border-color: var(--accent);
            color: var(--bg);
        }

        .cta-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 0%;
            height: 100%;
            background: var(--accent);
            z-index: -1;
            transition: width 0.4s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .cta-btn:hover::before {
            width: 100%;
        }

        .coordinates {
            text-align: right;
            font-family: 'Manrope', sans-serif;
            font-size: 0.7rem;
            opacity: 0.5;
            line-height: 1.5;
        }

        /* --- ANIMATIONS --- */
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 60, 0, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(255, 60, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 60, 0, 0); }
        }

        @keyframes textReveal {
            0% { clip-path: polygon(0 100%, 100% 100%, 100% 100%, 0 100%); transform: translateY(50px); }
            100% { clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); transform: translateY(0); }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .ui-layer { padding: 8vw; }
            h1 { font-size: 15vw; }
            .bottom-bar { flex-direction: column-reverse; align-items: center; gap: 2rem; }
            .cta-btn { width: 100%; text-align: center; }
        }
    </style>
</head>
<body>

    <div class="grain"></div>

    <div class="cursor" id="cursor"></div>

    <div id="canvas-wrapper">
        <canvas id="neuralCanvas"></canvas>
    </div>

    <main class="ui-layer">
        
        <div class="top-bar">
            <div>
                <span class="status-dot"></span>
                SYSTEM INITIALIZATION
            </div>
            <div>EST. 2026</div>
        </div>

        <div class="hero-container" id="hero">
            <h1>
                <span>ALIMENTARUS</span>
                <span>SYSTEMS</span>
                
                <div class="filled-text">
                    <span>ALIMENTARUS</span>
                    <span>SYSTEMS</span>
                </div>
            </h1>
            <div class="sub-hero">Global Infrastructure Protocol</div>
        </div>

        <div class="bottom-bar">
            <button class="cta-btn" onmouseenter="hoverCursor()" onmouseleave="unhoverCursor()">Request Access</button>
            <div class="coordinates">
                LAT: 40.7128° N<br>
                LNG: 74.0060° W<br>
                SECURE SERVER: ACTIVE
            </div>
        </div>

    </main>

    <script>
        // --- CUSTOM CURSOR LOGIC ---
        const cursor = document.getElementById('cursor');
        
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        function hoverCursor() {
            cursor.classList.add('hovered');
        }

        function unhoverCursor() {
            cursor.classList.remove('hovered');
        }

        // --- 3D TILT EFFECT ON TYPOGRAPHY ---
        const hero = document.getElementById('hero');
        const sensitivity = 20; // Lower is more extreme

        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth / 2 - e.clientX) / sensitivity;
            const y = (window.innerHeight / 2 - e.clientY) / sensitivity;
            
            // Apply rotation based on mouse position
            hero.style.transform = `rotateX(${y}deg) rotateY(${(-x)}deg)`;
        });

        // --- CANVAS PARTICLE NETWORK ---
        const canvas = document.getElementById('neuralCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;
                this.size = Math.random() * 2;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            const particleCount = Math.min(window.innerWidth / 10, 100); 
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();

                // Draw connections
                for (let j = i; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < 150) {
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(255, 255, 255, ${0.1 - distance/1500})`;
                        ctx.lineWidth = 1;
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animate);
        }

        initParticles();
        animate();
    </script>
</body>
</html>
